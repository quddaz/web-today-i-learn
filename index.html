<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <!-- Open Graph -->
    <meta property="og:title" content="빙응의 TIL 페이지" />
    <meta property="og:description" content="개발 성장 기록 페이지" />
    <meta property="og:image" content="./images/thumbnail.jpg" />

    <title>쿠다  Today I Learn</title>
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/index.js" defer></script>
  </head>

  <body>
    <!-- 네비게이션 -->
    <header>
      <nav class="top-nav">
        <span class="nav-logo">My Page</span>
        <ul class="nav-links">
          <li><a href="#about">자기소개</a></li>
          <li><a href="#gallery">갤러리</a></li>
          <li><a href="#works">인생 작품</a></li>
          <li><a href="#til">TIL</a></li>
        </ul>
      </nav>
    </header>

    <!-- 프로필 -->
    <section class="hero" id="about">
      <div class="profile-card">
        <div class="profile-image">
          <img src="./images/profile.jpg" alt="프로필 사진" />
        </div>
        <div class="profile-info">
          <h1>쿠다</h1>
          <p class="tagline">소통하는 백엔드 개발자 🚀</p>
        </div>
      </div>
    </section>

    <main>
      <!-- 자기소개 -->
      <section class="content-section">
        <h2>자기소개</h2>
        <p>
          안녕하세요. 백엔드 개발자를 목표로 공부하고 있습니다.  
          성능 최적화와 데이터 처리에 관심이 많습니다.
          <br />
          👉
          <a href="https://github.com/quddaz" target="_blank">GitHub</a>
        </p>
      </section>

      <!-- 기본 정보 -->
      <section class="content-section" id="info">
        <h2>기본 정보</h2>
        <table class="info-table">
          <tr>
            <th>이름</th>
            <td>쿠다</td>
          </tr>
          <tr>
            <th>MBTI</th>
            <td>ESTP</td>
          </tr>
          <tr>
            <th>취미</th>
            <td>코딩, 수다</td>
          </tr>
          <tr>
            <th>좋아하는 음식</th>
            <td>치킨 🍗</td>
          </tr>
        </table>
      </section>

      <!-- 갤러리 -->
      <section class="content-section" id="gallery">
        <h2>나만의 갤러리</h2>
        <p class="section-desc">내가 좋아하는 순간들 📸</p>

        <div class="gallery-grid">
          <img src="./images/g1.jpg" alt="갤러리1" />
          <img src="./images/g2.jpg" alt="갤러리2" />
          <img src="./images/g3.jpg" alt="갤러리3" />
          <img src="./images/g4.jpg" alt="갤러리4" />
          <img src="./images/g5.jpg" alt="갤러리5" />
          <img src="./images/g6.jpg" alt="갤러리6" />
          <img src="./images/g7.jpg" alt="갤러리7" />
          <img src="./images/g8.jpg" alt="갤러리8" />
          <img src="./images/g9.jpg" alt="갤러리9" />
        </div>
      </section>

      <!-- 인생 작품 -->
      <section class="content-section" id="works">
        <h2>나를 울린 인생 작품</h2>
        <div class="works-list">
          <!-- TODO: 최소 2가지 작품을 소개하세요 -->
          <!-- TODO: 작품 중 하나는 <video> 또는 <iframe>으로 영상을 삽입하세요 -->
          <article class="work-card">
            <div class="work-thumbnail">
              <!-- 작품 이미지 -->
            </div>
            <div class="work-info">
              <h3>작품 제목</h3>
              <p>작품에 대한 설명을 작성해주세요.</p>
            </div>
          </article>
        </div>
      </section>

      <!-- TIL -->
      <section class="content-section" id="til">
        <h2>TIL</h2>
        <p class="section-desc">오늘 배운 것 기록 📘</p>

        <form class="til-form" id="til-form">
          <div class="form-group">
            <label for="til-date">날짜</label>
            <input type="date" id="til-date" required />
          </div>

          <div class="form-group">
            <label for="til-title">제목</label>
            <input type="text" id="til-title" required />
          </div>

          <div class="form-group">
            <label for="til-content">내용</label>
            <textarea id="til-content" required></textarea>
          </div>

          <button type="submit">등록</button>
        </form>

        <div class="til-list" id="til-list"></div>
      </section>
    </main>

    <footer>
      <p>&copy; My Page</p>
    </footer>
  </body>
</html>
